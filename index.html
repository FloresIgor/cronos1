<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contagem Regressiva</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #000000, #111111);
      color: purple;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
#timer {
  font-size: 5rem;
  text-align: center;
  animation: pulse 5s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.6; }
  100% { opacity: 1; }
}
    #titulo {
  font-size: 5rem;
  margin-bottom: 70px;
  text-align: center;
    }
  </style>
</head>
<body>
  <div>
  <h1 id="titulo">Nosso Primeiro Beijo:</h1>

  <div id="timer">Carregando...</div>

  <script>
    // 04 de abril de 2026 às 22:00 (horário local de quem abrir)
    const targetDate = new Date(2026, 3, 4, 22, 30, 0);
    // mês começa do 0 → abril = 3

    function updateTimer() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("timer").innerText = "Chegou o momento.";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("timer").innerText =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
